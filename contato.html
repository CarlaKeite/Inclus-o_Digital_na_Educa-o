<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato - Inclusão Digital</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>INCLUSÃO DIGITAL NA EDUCAÇÃO</h1>
        <nav>
            <a href="../index.html">Início</a>
            <a href="../pages/sobre.html">Sobre</a>
            <a href="../pages/contato.html">Contato</a>
            <a href="../pages/login.html">Login</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Entre em Contato</h2>
            <p>Preencha o formulário abaixo para enviar sua mensagem ou tirar dúvidas sobre inclusão digital.</p>
        </section>

        <form id="contactForm">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required>

            <label for="celular">Celular:</label>
            <input type="tel" id="celular" name="celular" placeholder="(99) 99999-9999" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

            <label for="confirmarSenha">Confirme a Senha:</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme a senha" required>

            <button type="submit">Enviar</button>
            <p id="formMsg"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Projeto Inclusão Digital na Educação.</p>
    </footer>

    <script src="js/form.js"></script>
</body>
</html>
